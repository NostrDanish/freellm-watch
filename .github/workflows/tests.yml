name: FreeLLM Watch tests

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
